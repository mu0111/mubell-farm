{{#if hero_image}}<div class="page-hero" style="width:100%;max-height:420px;overflow:hidden;margin-bottom:0;">
  <img src="{{hero_image}}" alt="{{hero_image_alt}}" style="width:100%;height:420px;object-fit:cover;display:block;" loading="eager">
</div>{{/if}}
<section class="section" id="{{page_id}}">
  <div class="container">
    <div class="text-center">
      <h1 class="section-title">{{title}}</h1>
      {{#if subtitle}}<p class="section-subtitle">{{subtitle}}</p>{{/if}}
    </div>
    <div class="prose">
      {{body}}
    </div>
  </div>
</section>
