<header class="hero" id="top">
  <div class="hero__image">
    <img src="{{root}}images/hero.jpg" alt="{{hero_alt}}" width="1920" height="1080">
  </div>
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <div class="hero__logo">
      <svg class="hero__logo-svg" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{hero_svg_label}}">
        <defs>
          <path id="arch-path" d="M 50,245 Q 250,15 450,245" fill="none"/>
        </defs>
        <!-- Arched farm name -->
        <text font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="600" fill="#FAF7F2" letter-spacing="6">
          <textPath href="#arch-path" startOffset="50%" text-anchor="middle">{{hero_arch_text}}</textPath>
        </text>
        <!-- Decorative separator -->
        <line x1="155" y1="258" x2="237" y2="258" stroke="rgba(250,247,242,0.3)" stroke-width="0.5"/>
        <text x="250" y="262" text-anchor="middle" font-size="7" fill="rgba(250,247,242,0.4)">&#x25C6;</text>
        <line x1="263" y1="258" x2="345" y2="258" stroke="rgba(250,247,242,0.3)" stroke-width="0.5"/>
        <!-- Brand name -->
        <text x="250" y="290" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="34" fill="#FAF7F2" letter-spacing="2">MuBell Farm</text>
        <!-- Since year -->
        <text x="250" y="314" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" fill="rgba(250,247,242,0.6)" letter-spacing="5">{{hero_since}}</text>
      </svg>
    </div>
    <p class="hero__tagline">{{hero_tagline}}</p>
    <a href="{{root}}om-os" class="hero__scroll">
      <span class="hero__scroll-icon"></span>
      <span>{{hero_scroll}}</span>
    </a>
  </div>
</header>
