backend:
  name: github
  repo: mu0111/mubell-farm
  branch: main
  base_url: https://mubell-farm-oauth.murat-armbruster.workers.dev

publish_mode: editorial_workflow

media_folder: images
public_folder: /images

collections:
  # --- PAGES (Dansk) ---
  - name: pages-da
    label: "Sider (Dansk)"
    files:
      - name: index-da
        label: "Forside"
        file: content/pages/index.da.md
        fields:
          - { name: hero_image, label: "Hovedbillede", widget: image, required: false }
          - { name: hero_title, label: "Overskrift", widget: string }
          - { name: hero_subtitle, label: "Undertekst", widget: string }
          - { name: body, label: "Indhold", widget: markdown }
      - name: opstaldning-da
        label: "Opstaldning"
        file: content/pages/opstaldning.da.md
        fields:
          - { name: title, label: "Titel", widget: string }
          - { name: subtitle, label: "Undertekst", widget: string, required: false }
          - { name: body, label: "Indhold", widget: markdown }
      - name: undervisning-da
        label: "Undervisning"
        file: content/pages/undervisning.da.md
        fields:
          - { name: title, label: "Titel", widget: string }
          - { name: body, label: "Indhold", widget: markdown }
      - name: events-da
        label: "Events"
        file: content/pages/events.da.md
        fields:
          - { name: title, label: "Titel", widget: string }
          - { name: body, label: "Indhold", widget: markdown }
      - name: om-os-da
        label: "Om os"
        file: content/pages/om-os.da.md
        fields:
          - { name: title, label: "Titel", widget: string }
          - { name: body, label: "Indhold", widget: markdown }
      - name: kontakt-da
        label: "Kontakt"
        file: content/pages/kontakt.da.md
        fields:
          - { name: title, label: "Titel", widget: string }
          - { name: body, label: "Indhold", widget: markdown }

  # --- PAGES (English) ---
  - name: pages-en
    label: "Pages (English)"
    files:
      - name: index-en
        label: "Home"
        file: content/pages/index.en.md
        fields:
          - { name: hero_image, label: "Hero image", widget: image, required: false }
          - { name: hero_title, label: "Title", widget: string }
          - { name: hero_subtitle, label: "Subtitle", widget: string }
          - { name: body, label: "Content", widget: markdown }
      - name: opstaldning-en
        label: "Boarding"
        file: content/pages/opstaldning.en.md
        fields:
          - { name: title, label: "Title", widget: string }
          - { name: subtitle, label: "Subtitle", widget: string, required: false }
          - { name: body, label: "Content", widget: markdown }
      - name: undervisning-en
        label: "Teaching"
        file: content/pages/undervisning.en.md
        fields:
          - { name: title, label: "Title", widget: string }
          - { name: body, label: "Content", widget: markdown }
      - name: events-en
        label: "Events"
        file: content/pages/events.en.md
        fields:
          - { name: title, label: "Title", widget: string }
          - { name: body, label: "Content", widget: markdown }
      - name: om-os-en
        label: "About us"
        file: content/pages/om-os.en.md
        fields:
          - { name: title, label: "Title", widget: string }
          - { name: body, label: "Content", widget: markdown }
      - name: kontakt-en
        label: "Contact"
        file: content/pages/kontakt.en.md
        fields:
          - { name: title, label: "Title", widget: string }
          - { name: body, label: "Content", widget: markdown }

  # --- HORSES ---
  - name: horses
    label: "Heste / Horses"
    folder: content/horses
    create: true
    slug: "{{name}}"
    extension: da.md
    fields:
      - { name: name, label: "Navn", widget: string }
      - name: category
        label: "Kategori"
        widget: select
        options:
          - { label: "Hoppe", value: "hoppe" }
          - { label: "Hingst", value: "hingst" }
          - { label: "Shetlandspony", value: "shetlandspony" }
          - { label: "Vallak", value: "vallak" }
      - { name: breed, label: "Race", widget: string, default: "Islandsk hest", required: false }
      - { name: birth_year, label: "Foedselsaar", widget: number, required: false }
      - { name: photo, label: "Billede", widget: image, required: false }
      - { name: facebook_url, label: "Facebook link", widget: string, required: false }
      - { name: body, label: "Beskrivelse", widget: markdown }

  # --- NEWS ---
  - name: news
    label: "Nyheder / News"
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: da.md
    fields:
      - { name: title, label: "Titel", widget: string }
      - { name: date, label: "Dato", widget: datetime }
      - { name: featured_image, label: "Billede", widget: image, required: false }
      - { name: excerpt, label: "Kort beskrivelse", widget: text, required: false }
      - { name: body, label: "Indhold", widget: markdown }

  # --- TESTIMONIALS ---
  - name: testimonials
    label: "Anbefalinger / Testimonials"
    folder: content/testimonials
    create: true
    slug: "{{name}}"
    fields:
      - { name: name, label: "Navn", widget: string }
      - { name: role, label: "Rolle", widget: string, required: false }
      - { name: quote, label: "Citat", widget: text }
      - { name: photo, label: "Billede", widget: image, required: false }
      - { name: date, label: "Dato", widget: datetime, required: false }

  # --- SETTINGS ---
  - name: settings
    label: "Indstillinger / Settings"
    files:
      - name: site
        label: "Sideindstillinger"
        file: content/settings.json
        fields:
          - { name: site_title, label: "Sidetitel", widget: string }
          - { name: tagline, label: "Tagline", widget: string, required: false }
          - { name: logo, label: "Logo", widget: image, required: false }
          - { name: phone, label: "Telefon", widget: string, required: false }
          - { name: email, label: "Email", widget: string }
          - { name: address, label: "Adresse", widget: text }
          - { name: instagram_url, label: "Instagram URL", widget: string, required: false }
          - { name: facebook_url, label: "Facebook URL", widget: string, required: false }
